name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projection-globe/package-lock.json

      - name: Install dependencies
        working-directory: projection-globe
        run: npm ci

      - name: Build globe
        working-directory: projection-globe
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='node_modules/' --exclude='dist/' --exclude='.env*' --exclude='projection-globe/' --exclude='*.tif' --exclude='*.tiff' --exclude='*.zip' --exclude='*.gpkg' --exclude='*.gdb' --exclude='*.mov' --exclude='*.qgz' --exclude='*.shp' --exclude='*.shx' --exclude='*.dbf' --exclude='*.prj' --exclude='*.cpg' ./ _site/
          mkdir -p _site/projection-globe
          cp -a projection-globe/dist/. _site/projection-globe/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
